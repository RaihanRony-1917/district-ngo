services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Used in the frontend build stage of the Dockerfile
        VITE_ASSET_URL: ${VITE_ASSET_URL:-}
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/html/.env:ro
    ports:
      - "${APP_PORT:-10000}:10000"
    restart: unless-stopped

